<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DuitKu">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>DuitKu – Student Expense Tracker</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2033;--mut:#6b738c;--pri:#4f46e5;--bd:#e4e8f2;--red:#e11d48;--grn:#059669;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#1a1e33;--tx:#eef0f8;--mut:#98a0bc;--pri:#818cf8;--bd:#2a3050;--red:#fb7185;--grn:#34d399}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#1a1e33;--tx:#eef0f8;--mut:#98a0bc;--pri:#818cf8;--bd:#2a3050;--red:#fb7185;--grn:#34d399}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
#root{max-width:480px;margin:0 auto;min-height:100vh;padding:16px 14px 90px}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:0}
.mut{color:var(--mut);font-size:13px}.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.big{font-size:28px;font-weight:700}
.chip{display:inline-block;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-size:13px;margin:0 6px 6px 0;color:var(--tx);cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
input,select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;margin-bottom:10px}
button{font:inherit;cursor:pointer}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px;width:100%;font-weight:600}
.btn.ghost{background:transparent;color:var(--red);border:1px solid var(--bd);margin-top:8px}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{display:flex;width:100%;max-width:480px}
.nav button{flex:1;background:none;border:0;padding:10px 0;color:var(--mut);font-size:12px}
.nav button.on{color:var(--pri);font-weight:700}.nav b{display:block;font-size:20px}
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--pri);color:#fff;border:0;font-size:30px;box-shadow:0 6px 18px rgba(79,70,229,.45)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%}
.sc{overflow-x:auto}
</style>
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})</script>
</body>
</html>
